name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # From PyPI. throughline 3.11.0 or later composes the declared sources itself.
      - name: Install throughline
        run: pip install 'throughline>=3.11.0'

      - name: Composition gate (the composed graph must stay sound)
        run: tl check --strict
