title: Close with a formal sign-off and the sender's name and role
text: 'The letter closes with a sign-off followed by the sender''s name and role. That
  a sign-off exists is a letter-channel decision; that it reads "Yours sincerely" rather
  than a casual close is a formal-register decision.'
